# konfig — dotter manifest
#
# Each [<pkg>.files] entry maps a repo path -> a deploy target. Because the
# mapping is explicit, repo paths stay flat: config/fish, not
# fish/.config/fish/.
#
# Enable packages per-machine in .dotter/local.toml (gitignored):
#   packages = ["fish", "nvim", "kitty"]
#
# Deploy:  dotter deploy         Preview: dotter deploy --dry-run
# Undeploy: dotter undeploy

# ---------------------------------------------------------------- XDG configs

[alacritty.files]
"config/alacritty" = { target = "~/.config/alacritty", type = "symbolic" }

[fish.files]
"config/fish" = { target = "~/.config/fish", type = "symbolic" }

[fontconfig.files]
"config/fontconfig" = { target = "~/.config/fontconfig", type = "symbolic" }

[git.files]
"config/git" = { target = "~/.config/git", type = "symbolic" }

[hypr.files]
"config/hypr" = { target = "~/.config/hypr", type = "symbolic" }

# type = "symbolic" is REQUIRED here, not cosmetic: dotter treats any file
# containing '{{' as a Handlebars template and renders it. kitty.conf uses
# '{{{' as vim fold markers, so the default (template) would mangle it.
[kitty.files]
"config/kitty" = { target = "~/.config/kitty", type = "symbolic" }

[ncmpcpp.files]
"config/ncmpcpp" = { target = "~/.config/ncmpcpp", type = "symbolic" }

[newsraft.files]
"config/newsraft" = { target = "~/.config/newsraft", type = "symbolic" }

# symbolic for the same reason as kitty: .github/workflows/stylua.yml contains
# GitHub Actions '${{ ... }}' expressions that Handlebars would try to render.
[nvim.files]
"config/nvim" = { target = "~/.config/nvim", type = "symbolic" }

[tealdeer.files]
"config/tealdeer" = { target = "~/.config/tealdeer", type = "symbolic" }

[tmux.files]
"config/tmux" = { target = "~/.config/tmux", type = "symbolic" }

[waybar.files]
"config/waybar" = { target = "~/.config/waybar", type = "symbolic" }

# ---------------------------------------------------------------- systemd user
# Units are listed INDIVIDUALLY rather than linking the whole user/ directory,
# because user/ also contains hyprland-session.target.wants/ — a tree of
# absolute symlinks generated by `systemctl --user enable`. dotter walks
# directories and errors on symlinks whose target does not currently exist, and
# enablement state belongs to systemctl, not to this repo.
#
# After deploying: systemctl --user daemon-reload
# To enable:      systemctl --user enable waybar.service

[systemd.files]
"config/systemd/user/dunst.service" = { target = "~/.config/systemd/user/dunst.service", type = "symbolic" }
"config/systemd/user/easyeffect.service" = { target = "~/.config/systemd/user/easyeffect.service", type = "symbolic" }
"config/systemd/user/hyprland.service" = { target = "~/.config/systemd/user/hyprland.service", type = "symbolic" }
"config/systemd/user/hyprland-session.target" = { target = "~/.config/systemd/user/hyprland-session.target", type = "symbolic" }
"config/systemd/user/mopidy.service" = { target = "~/.config/systemd/user/mopidy.service", type = "symbolic" }
"config/systemd/user/nm-applet.service" = { target = "~/.config/systemd/user/nm-applet.service", type = "symbolic" }
"config/systemd/user/polkit-kde-agent.service" = { target = "~/.config/systemd/user/polkit-kde-agent.service", type = "symbolic" }
"config/systemd/user/protonvpn_reconnect.service" = { target = "~/.config/systemd/user/protonvpn_reconnect.service", type = "symbolic" }
"config/systemd/user/waybar.service" = { target = "~/.config/systemd/user/waybar.service", type = "symbolic" }
# hyprland-session.service is a symlink to /dev/null — a deliberate mask.
# Deploying it as a symlink preserves the mask; do not convert it to a copy.
"config/systemd/user/hyprland-session.service" = { target = "~/.config/systemd/user/hyprland-session.service", type = "symbolic" }

# ------------------------------------------------------------------ non-XDG
# gnupg: link the two config files INDIVIDUALLY, never the directory. ~/.gnupg
# holds live keyrings (private-keys-v1.d, trustdb.gpg) that must not be
# replaced by a symlink into the repo.

[gnupg.files]
"home/gnupg/common.conf" = { target = "~/.gnupg/common.conf", type = "symbolic" }
"home/gnupg/gpg-agent.conf" = { target = "~/.gnupg/gpg-agent.conf", type = "symbolic" }
